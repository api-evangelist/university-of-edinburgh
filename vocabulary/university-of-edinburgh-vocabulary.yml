vocabulary:
  name: University of Edinburgh Programmable Surface Vocabulary
  description: >-
    Controlled vocabulary of the domain terms exposed across the institution-operated
    University of Edinburgh surfaces: the DSpace 8.3 repositories (Edinburgh DataShare
    and the Edinburgh Research Archive), the EIDF Data Catalogue (CKAN) and the ELM
    generative-AI gateway. Re-derived on 2026-08-19 from probed responses after the
    DSpace 6 legacy REST API these terms originally described was found retired.
  version: "2.0.0"
  generated: '2026-08-19'
  method: derived
  source: https://datashare.ed.ac.uk/server/api
  operator: institution
  terms:
    - term: Community
      definition: >-
        Top-level or nested organisational grouping in DSpace (e.g. a College
        or research centre) that contains collections and subcommunities.
      tags: [object, dspace, hierarchy]
    - term: Collection
      definition: >-
        A grouping of related items within a community; the container into
        which items are deposited.
      tags: [object, dspace, hierarchy]
    - term: Item
      definition: >-
        The primary unit of deposit in the repository, consisting of metadata
        and one or more bitstreams.
      tags: [object, dspace, deposit]
    - term: Bitstream
      definition: >-
        A binary file (data file, document, thumbnail or licence) attached to
        an item, grouped into a bundle.
      tags: [object, dspace, file]
    - term: Bundle
      definition: >-
        A named grouping of bitstreams within an item, such as ORIGINAL,
        THUMBNAIL or CC-LICENSE.
      tags: [dspace, file]
    - term: Handle
      definition: >-
        Persistent identifier assigned to communities, collections and items
        (e.g. 10283/5507) under the Handle System.
      tags: [identifier, persistence]
    - term: MetadataEntry
      definition: >-
        A single qualified Dublin Core metadata statement on an item,
        expressed as schema.element.qualifier with a value and language.
      tags: [metadata, dublin-core]
    - term: MetadataSchema
      definition: >-
        A registered namespace of metadata fields (e.g. the dc Dublin Core
        schema) available in the repository registry.
      tags: [metadata, registry]
    - term: CheckSum
      definition: >-
        Integrity digest (value plus algorithm, typically MD5) recorded for a
        bitstream.
      tags: [file, integrity]
    - term: ResourcePolicy
      definition: >-
        Authorisation rule controlling an action (e.g. READ) on a DSpace
        resource for a given eperson or group.
      tags: [authorization, policy]
    - term: Expand
      definition: >-
        Query parameter requesting that optional related fields (such as
        metadata, bitstreams or collections) be inlined in the response.
      tags: [parameter, query]
    - term: Handle
      definition: >-
        Persistent Handle System identifier assigned to every community, collection
        and item. DataShare uses prefix 10283; the Edinburgh Research Archive uses 1842.
      tags: [identifier, dspace, persistent]
    - term: DOI
      definition: >-
        DataCite Digital Object Identifier minted under the University of Edinburgh
        prefix 10.7488 — 10.7488/ds/* for DataShare deposits, 10.7488/era/* for ERA.
      tags: [identifier, datacite, persistent]
    - term: Set
      definition: >-
        OAI-PMH set used to scope a selective harvest. Both repositories expose one set
        per community and collection, named com_<prefix>_<id> and col_<prefix>_<id>.
      tags: [oai-pmh, harvesting]
    - term: MetadataPrefix
      definition: >-
        OAI-PMH metadata format identifier. Both repositories serve oai_dc, qdc, dim,
        mods, mets, ore, didl, xoai, rdf, marc and the UK research formats rioxx and
        uketd_dc; ERA adds etdms for electronic theses.
      tags: [oai-pmh, metadata]
    - term: Package
      definition: >-
        A dataset record in the EIDF Data Catalogue (CKAN terminology). Owned by an
        EIDF project organisation and named with that project's code as a prefix.
      tags: [object, ckan, open-data]
    - term: EIDF Project
      definition: >-
        A funded project on the Edinburgh International Data Facility, modelled as a
        CKAN organisation and used as the ownership boundary for published datasets.
      tags: [object, ckan, research-computing]
    - term: ELM
      definition: >-
        Edinburgh Language Models — the University's own generative-AI access platform,
        exposing an OpenAI-compatible bearer-authenticated API to UK tertiary education.
      tags: [ai, gateway, institution-operated]
