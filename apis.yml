- aid: university-of-edinburgh:enterprise-api-gateway
  name: Enterprise API Gateway (gated)
  x-operator: institution
  x-operator-evidence: >-
    api.ed.ac.uk is under ed.ac.uk and resolves to a WSO2 Choreo tenant named uoe (f5aad5f4-...-prod.prod.uoe.choreoapis.dev)
  description: >-
    The University's Enterprise APIs programme — Student Records, Timetabling and Staff APIs — runs on
    a WSO2 Choreo gateway at api.ed.ac.uk. The gateway is live and Edinburgh-operated, but every probed
    path returns its own JSON 404 envelope, including /openapi, /api-docs, /services and /.well-known/openid-configuration.
    No route, no catalogue, no developer portal, no scopes. Recorded as a gated surface rather than an
    absent one. The programme's own public project pages returned HTTP 500 on both digital-strategy.ed.ac.uk
    and www.ed.ac.uk when probed on 2026-08-19, so the institution's public account of its API programme
    is currently broken.
  humanURL: >-
    https://www.ed.ac.uk/information-services/enterprise-architecture/application-integration/apis-and-connectors
