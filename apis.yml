aid: university-of-edinburgh
name: University of Edinburgh
x-type: university
x-category: Public Research University
description: >-
  The University of Edinburgh is a public research university in Scotland, founded in
  1582, a member of the Russell Group and ranked #19 in the QS World University
  Rankings. Its programmable footprint is real but narrow, and it is not where the
  catalog previously said it was. Re-profiled on 2026-08-19 against the operator axis,
  the institution genuinely operates: two DSpace 8.3 research repositories on its own
  domain (Edinburgh DataShare and the Edinburgh Research Archive) each with a REST API
  and an OAI-PMH 2.0 endpoint minting DataCite DOIs under the University prefix 10.7488;
  a Shibboleth Identity Provider publishing SAML 2.0 metadata unauthenticated; a CKAN
  2.11.3 open-data catalogue for the Edinburgh International Data Facility; and ELM
  (Edinburgh Language Models), an OpenAI-compatible generative-AI gateway that EDINA
  operates for UK tertiary education — the one surface here where Edinburgh is clearly
  a producer rather than a buyer. An Enterprise API programme runs on a WSO2 Choreo
  gateway at api.ed.ac.uk, which is live but exposes no public route, catalogue or
  developer portal, and whose own public project pages returned HTTP 500 on every probe.
  The library discovery layer (Ex Libris Primo) and the research information system
  (Elsevier Pure) are vendor platforms recorded here as tenant relationships, not as
  Edinburgh contracts. This profile is deliberately smaller than the June 2026 one: the
  seven OpenAPI documents previously held for this institution described the DSpace 6
  legacy /rest API, which is retired and now returns 404.
