  name: Edinburgh Research Explorer (Elsevier Pure) — tenant
  x-operator: tenant
  x-operator-evidence: >-
    www.pure.ed.ac.uk is an Edinburgh-branded subdomain running Elsevier Pure; https://www.pure.ed.ac.uk/ws/api
    canonicalises to https://api.elsevierpure.com/ws/api/index.html, so the contract is Elsevier's and
    is not saved under this institution.
  description: >-
    Edinburgh Research Explorer is the University's public research information portal, running on Elsevier
    Pure. The research outputs, the people and the DOIs are Edinburgh's; the API contract is Elsevier's
    and belongs on Elsevier's own record. Recorded here as a real tenant relationship rather than deleted
    or credited. The Pure OAI-PMH endpoint returned HTTP 500 on both www.pure.ed.ac.uk/ws/oai and www.research.ed.ac.uk/ws/oai
    when probed on 2026-08-19, so the harvesting surface is currently broken; the previous dead pointer
    to it has been removed.
