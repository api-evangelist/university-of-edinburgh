  reason: institution_operates_narrow_public_surface
  detail: >-
    Every surface class in the university playbook was hunted on 2026-08-19 and the
    result is a small but genuine institution-operated footprint, plus two tenant
    relationships and one live-but-gated gateway. What was found: research repositories
    (institution, DSpace 8.3 on ed.ac.uk), OAI-PMH (institution, both repositories),
    identity federation (institution, Shibboleth SAML metadata at idp.ed.ac.uk), open
    data (institution, CKAN at catalogue.eidf.ac.uk on an Edinburgh-owned domain), AI
    tooling (institution, ELM on edina.ac.uk, OpenAI-compatible and bearer-authenticated),
    research computing (institution, EPCC/EIDF portal). What was NOT found: no course
    catalog or timetable API — the Degree Regulations and Programmes of Study site is
    HTML only; no campus-life API of any kind; no SCIM, LTI, OneRoster, Ed-Fi, Caliper
    or QTI surface; no llms.txt and no security.txt on the main domain. What is gated:
    the Enterprise API gateway at api.ed.ac.uk, which resolves to a WSO2 Choreo tenant
    named `uoe` and answers every probed path with its own JSON 404 envelope. This is
    not a thin profile caused by our own visibility limits — the probes ran clean and
    the absences are the institution's, not ours.
