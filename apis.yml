apis:
- aid: university-of-edinburgh:elm-api
  name: ELM — Edinburgh Language Models API
  x-operator: institution
  x-operator-evidence: >-
    edina.ac.uk Nominet Domain Owner: University of Edinburgh, Registered For: EDINA National Data Centre
  description: >-
    OpenAI-compatible generative-AI gateway built and run by EDINA at the University of Edinburgh, described
    by its own metadata as delivering generative AI to UK tertiary education. /api/v1/models and /api/v1/chat/completions
    both answer 401 with an OpenAI-shaped error envelope without a bearer token, which is what establishes
    the routes and the auth scheme; /health returns 200. No public self-service registration and no published
    OpenAPI (/openapi.json returns the SPA shell). This is the clearest case in the profile of Edinburgh
    acting as an API producer rather than a buyer.
  humanURL: https://information-services.ed.ac.uk/computing/comms-and-collab/elm
  baseURL: https://elm.edina.ac.uk/api/v1
