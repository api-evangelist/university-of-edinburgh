  name: University of Edinburgh Shibboleth Identity Provider
  x-operator: institution
  x-operator-evidence: idp.ed.ac.uk is under ed.ac.uk; metadata OrganizationName is "University of Edinburgh"
  description: >-
    Shibboleth Identity Provider publishing SAML 2.0 entity metadata unauthenticated at a stable URL,
    entityID https://idp.ed.ac.uk/shibboleth. Advertises the full SAML 2.0 binding set for SSO and Single
    Logout plus SAML 1 artifact resolution and attribute query. Institution-operated by definition and
    machine-readable. Note the IdP web root returns 403 by design — the metadata path is the machine surface
    and it answers 200.
