    summary: >-
      Verified live, public, no-authentication endpoints for research
      infrastructure: Edinburgh DataShare DSpace REST API (returns JSON),
      DataShare OAI-PMH, and the Pure / Research Explorer OAI-PMH endpoint
      (both return valid OAI-PMH XML). Pure SOAP/REST web services are gated
      (granted case by case). The Enterprise APIs programme (Student Records,
      Timetabling, Staff) is documented behind University SAML SSO and is not
      publicly accessible. The verified official GitHub presence with public
      repositories is the IS Applications Directorate org (uoe-is-apps); the
      bare university-of-edinburgh GitHub org exists but exposes no public
      repos. No endpoints were fabricated; every URL below was probed.
    endpoints:
