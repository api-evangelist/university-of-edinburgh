---
name: University of Edinburgh
description: University of Edinburgh public developer/API footprint review for APIs.json cataloging.
url: https://raw.githubusercontent.com/api-evangelist/university-of-edinburgh/refs/heads/main/review.yml
created: '2026-06-03'
modified: '2026-08-19'
reviews:
  - date: '2026-06-03'
    rating: 3
    summary: >-
      Verified live, public, no-authentication endpoints for research
      infrastructure: Edinburgh DataShare DSpace REST API (returns JSON),
      DataShare OAI-PMH, and the Pure / Research Explorer OAI-PMH endpoint
      (both return valid OAI-PMH XML). Pure SOAP/REST web services are gated
      (granted case by case). The Enterprise APIs programme (Student Records,
      Timetabling, Staff) is documented behind University SAML SSO and is not
      publicly accessible. The verified official GitHub presence with public
      repositories is the IS Applications Directorate org (uoe-is-apps); the
      bare university-of-edinburgh GitHub org exists but exposes no public
      repos. No endpoints were fabricated; every URL below was probed.
    endpoints:
      - url: https://datashare.ed.ac.uk/
        status: 200
        note: Edinburgh DataShare repository home (live).
      - url: https://datashare.ed.ac.uk/rest
        status: 404
        note: >-
          RETIRED. Re-probed 2026-08-19. The DSpace 6 legacy REST API is gone; the host
          now serves a DSpace 8.3 Angular UI and returns 404 with a full HTML body.
      - url: https://datashare.ed.ac.uk/server/api
        status: 200
        note: >-
          Replacement DSpace 8.3 REST API (probed 2026-08-19). dspaceVersion "DSpace 8.3".
          Communities/collections/discover readable anonymously; items and bitstreams 401.
      - url: https://era.ed.ac.uk/server/api
        status: 200
        note: Edinburgh Research Archive, a second institution-operated DSpace 8.3 repository (probed 2026-08-19).
      - url: https://era.ed.ac.uk/oai/request?verb=Identify
        status: 200
        note: ERA OAI-PMH 2.0, 13 metadata prefixes including etdms (probed 2026-08-19).
      - url: https://idp.ed.ac.uk/idp/shibboleth
        status: 200
        note: >-
          Shibboleth IdP SAML 2.0 metadata, entityID https://idp.ed.ac.uk/shibboleth,
          OrganizationName "University of Edinburgh" (probed 2026-08-19).
      - url: https://catalogue.eidf.ac.uk/api/3/action/status_show
        status: 200
        note: >-
          EIDF Data Catalogue, CKAN 2.11.3, 14 public datasets, anonymous read
          (probed 2026-08-19). eidf.ac.uk Domain Owner is the University of Edinburgh.
      - url: https://elm.edina.ac.uk/api/v1/models
        status: 401
        note: >-
          ELM generative-AI gateway, OpenAI-compatible, bearer auth (probed 2026-08-19).
          edina.ac.uk Domain Owner is the University of Edinburgh.
      - url: https://api.ed.ac.uk/
        status: 404
        note: >-
          Enterprise API gateway, live. Resolves to WSO2 Choreo tenant `uoe`. Returns the
          gateway's own JSON 404 on every probed path; no public routes (probed 2026-08-19).
      - url: https://datashare.ed.ac.uk/oai/request?verb=Identify
        status: 200
        note: DataShare OAI-PMH endpoint; valid OAI-PMH XML returned.
      - url: https://www.pure.ed.ac.uk/ws/oai?verb=Identify
        status: 500
        note: >-
          Re-probed 2026-08-19: now returns HTTP 500. www.research.ed.ac.uk/ws/oai also
          500s. Elsevier Pure is a TENANT platform — the contract is Elsevier's, not
          Edinburgh's, and is not saved under this institution.
      - url: https://www.research.ed.ac.uk/
        status: 200
        note: Edinburgh Research Explorer public portal (live).
      - url: https://digital-strategy.ed.ac.uk/current-programmes-projects/enterprise-apis
        status: 500
        note: Redirects to SAML SSO (idp.ed.ac.uk); Enterprise APIs docs are gated/internal.
      - url: https://github.com/uoe-is-apps
        status: 200
        note: IS Applications Directorate org; 18 public repos (verified official).
      - url: https://github.com/university-of-edinburgh
        status: 200
        note: Org exists but shows no public repositories.
      - url: https://www.ed.ac.uk/
        status: 200
        note: Official University website (live).
      - url: https://www.linkedin.com/school/university-of-edinburgh/
        status: 999
        note: LinkedIn school page; 999 is LinkedIn bot blocking, URL is valid.
